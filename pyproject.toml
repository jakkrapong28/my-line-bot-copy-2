[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008", # FastAPI uses Depends/Header calls as its dependency declaration API.
    "E501", # Ruff's formatter intentionally leaves long URLs/Thai strings intact.
]

[tool.ruff.format]
quote-style = "double"
